<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Arrow Puzzle Online</title>
    <meta name="description" content="Play the free Arrow Puzzle logic game directly in your browser.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="play.css">
</head>
<body class="play-mode">
    <div class="game-wrapper">
        <header class="game-header">
            <a href="index.html" class="btn-back" aria-label="Back to home">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <div class="level-indicator">Level <span id="level-display">1</span></div>
            <button id="btn-settings" class="btn-icon" aria-label="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </header>

        <!-- Lives / Hearts Placeholder -->
        <div class="hearts-container">
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
        </div>

        <main class="board-area">
            <!-- The dot grid background and the puzzle pieces -->
            <div id="game-board" class="game-board">
                <div id="dot-grid" class="dot-grid"></div>
                <div id="pieces-container" class="pieces-container"></div>
            </div>
        </main>

        <!-- Footer Controls as seen in screenshots -->
        <footer class="game-controls">
            <button class="control-btn bulb-btn">
                💡<span class="hint-count">3</span>
            </button>
            <div class="zoom-slider-container">
                <span class="zoom-icon">🔍-</span>
                <input type="range" min="50" max="150" value="100" class="zoom-slider">
                <span class="zoom-icon">🔍+</span>
            </div>
            <button class="control-btn grid-btn">
                #
            </button>
        </footer>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">Level Cleared!</h2>
            <p class="modal-text">Path connected perfectly.</p>
            <button id="btn-next-level" class="btn-primary hover-lift">
                Next Level →
            </button>
        </div>
    </div>

    <!-- Lose Modal -->
    <div id="lose-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">💔</div>
            <h2 class="modal-title">Out of Moves!</h2>
            <p class="modal-text">You ran out of hearts.</p>
            <button id="btn-restart-level" class="btn-primary hover-lift">
                Restart Level ↻
            </button>
        </div>
    </div>

    <!-- Game Engine -->
    <script src="game.js"></script>
</body>
</html>
